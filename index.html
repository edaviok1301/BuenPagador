<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ranking de pagadores — Casa de Campo Fin de Año</title>
  <meta name="description" content="Ranking de quienes ya pagaron su cuota para la casa de campo de fin de año." />
  <link rel="icon" href="data:," />
  <script>
    (function () {
      var tema = 'light';
      try {
        var guardado = localStorage.getItem('theme');
        if (guardado === 'light' || guardado === 'dark') {
          tema = guardado;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          tema = 'dark';
        }
      } catch (err) {
        /* localStorage no disponible: se usa el valor por defecto 'light'. */
      }
      document.documentElement.dataset.theme = tema;
    })();
  </script>
  <link rel="stylesheet" href="./css/theme.css" />
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <div class="site-header__brand">
        <span class="site-header__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M3 11l9-7 9 7" /><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" /></svg>
        </span>
        <span class="site-header__text">
          <span class="site-header__title">Casa de Campo</span>
          <span class="site-header__subtitle">Encuentro de fin de año</span>
        </span>
      </div>
      <button id="theme-toggle" type="button" class="theme-toggle">
        <svg class="icono-sol" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
          <circle cx="12" cy="12" r="4.2" />
          <path d="M12 2.5v2.5M12 19v2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.5M19 12h2.5M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8" />
        </svg>
        <svg class="icono-luna" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden>
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" />
        </svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 class="hero__title">Ranking de pagadores</h1>
      <p class="hero__subtitle">El reconocimiento para quienes confirmaron primero ✨</p>
    </section>

    <p id="ranking-summary" class="ranking-summary" hidden></p>

    <output id="estado" class="estado" aria-live="polite" hidden></output>

    <div id="estado-vacio" class="estado-vacio" hidden>
      <p class="estado-vacio__titulo">Aún no hay pagos confirmados</p>
      <p class="estado-vacio__texto">El ranking aparecerá cuando se registre el primer pago.</p>
    </div>

    <section id="top-ranking" class="top-ranking" aria-label="Primeros tres lugares del ranking" hidden></section>

    <section id="remaining-ranking" class="remaining-ranking" aria-labelledby="titulo-resto" hidden>
      <h2 id="titulo-resto" class="remaining-ranking__titulo">Otros pagos confirmados</h2>
      <div id="lista-resto" class="participantes-grid"></div>
    </section>
  </main>

  <footer class="pie">
    <p>🎄 Nos vemos en la casa de campo</p>
  </footer>

  <script src="./js/theme.js"></script>
  <script src="./js/shared.js"></script>
  <script src="./js/index.js"></script>
</body>
</html>
